name: build-citrus

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig relatif terhadap arch/arm64/configs"
        required: true
        default: "vendor/citrus-stock-perf_defconfig"
      ksu_expected_size:
        description: "KSU_EXPECTED_SIZE (hex, mis. 0x1a2b3c) dari APK manager; kosong = placeholder"
        required: false
        default: ""
      ksu_expected_hash:
        description: "KSU_EXPECTED_HASH (sha256 APK manager); kosong = placeholder"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex libssl-dev libelf-dev \
            zip unzip curl python3 device-tree-compiler \
            gcc-aarch64-linux-gnu clang lld llvm

      - name: Build
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          KSU_EXPECTED_SIZE: ${{ inputs.ksu_expected_size }}
          KSU_EXPECTED_HASH: ${{ inputs.ksu_expected_hash }}
        run: |
          set -o pipefail
          export KBUILD_BUILD_USER="@Bob_Lvett" KBUILD_BUILD_HOST="toblust"
          clang --version
          rm -rf out
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 -j$(nproc) "$DEFCONFIG"
          scripts/config --file out/.config --disable MODULE_SIG --disable MODULE_SIG_FORCE \
            --disable MODULE_SIG_ALL --disable MODULE_SIG_SHA512 --disable MODULE_SIG_KEY 2>/dev/null || true
          scripts/config --file out/.config -e MODULES -e MODVERSIONS -e KSU_ALLOWLIST_WORKAROUND -d LOCALVERSION_AUTO --set-str LOCALVERSION "-perf-g9aba441cf6cd-dirty"
          scripts/config --file out/.config -e KSU -e KSU_SUSFS -e KSU_SUSFS_PRIORITY_UID_FILTER \
            -e KSU_HOOK_TRACEPOINT -d KSU_HOOK_SUSFS_INLINE \
            -e KPROBES -e KALLSYMS_ALL -e EXT4_FS -e THREAD_INFO_IN_TASK
          scripts/config --file out/.config -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SUS_MAP -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          grep -q "^CONFIG_MODVERSIONS=y" out/.config || { echo "MODVERSIONS tidak aktif"; exit 1; }
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 -j$(nproc) olddefconfig
          if grep -Eq '^CONFIG_MODULE_SIG(_FORCE|_ALL)?=y' out/.config; then
            echo "MODULE_SIG masih aktif"; exit 1
          fi
          for s in KSU KSU_SUSFS KSU_SUSFS_PRIORITY_UID_FILTER KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SUS_MAP KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_HOOK_TRACEPOINT KPROBES KALLSYMS_ALL EXT4_FS THREAD_INFO_IN_TASK; do
            grep -q "^CONFIG_${s}=y" out/.config || { echo "CONFIG_${s} tidak aktif setelah olddefconfig"; exit 1; }
          done
          grep -E "CONFIG_QCA_CLD_WLAN|CONFIG_SCHED_WALT|CONFIG_LOCALVERSION" out/.config | tee config-check.txt
          grep -E "^CONFIG_(KSU|KPROBES|KALLSYMS_ALL|EXT4_FS|THREAD_INFO_IN_TASK)" out/.config >> config-check.txt
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 -j$(nproc) headers_install
          [ -d out/usr/include/linux ] || { echo "out/usr/include tidak ada, preinit tidak bisa dibangun"; exit 1; }
          EXTRA=()
          if [ -n "$KSU_EXPECTED_SIZE" ]; then EXTRA+=("KSU_EXPECTED_SIZE=$KSU_EXPECTED_SIZE"); fi
          if [ -n "$KSU_EXPECTED_HASH" ]; then EXTRA+=("KSU_EXPECTED_HASH=$KSU_EXPECTED_HASH"); fi
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 "${EXTRA[@]}" -j$(nproc) 2>&1 | tee build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          ls out/arch/arm64/boot/Image* >/dev/null 2>&1 || { echo "Image tidak ada, build gagal"; exit 1; }
          cp out/arch/arm64/boot/Image* artifacts/
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} artifacts/ \; 2>/dev/null || true
          cp config-check.txt build.log artifacts/ 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-citrus
          path: artifacts/
