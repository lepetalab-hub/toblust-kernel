name: build-citrus

on:
  workflow_dispatch:
  push:
    branches: [ksun-susfs, ksun-susfs-pm]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and kernel build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev make python3

      - name: Configure citrus defconfig
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: "1"
        run: make vendor/citrus-stock-perf_defconfig

      - name: Verify process_mem is enabled
        run: |
          grep -q '^CONFIG_PROCESS_MEM=y' .config
          echo "CONFIG_PROCESS_MEM=y present"

      - name: Compile process_mem module object (-Werror via kernel defaults)
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: "1"
        run: make -j"$(nproc)" modules_prepare drivers/misc/process_mem/process_mem_module.o

      - name: Build full kernel image and modules
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: "1"
        run: make -j"$(nproc)" Image modules

      - uses: actions/upload-artifact@v4
        with:
          name: citrus-kernel-${{ github.sha }}
          path: |
            arch/arm64/boot/Image
            .config
            drivers/misc/process_mem/process_mem_module.o
          if-no-files-found: error
